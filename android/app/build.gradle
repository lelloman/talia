plugins {
    id 'com.lelloman.paravoid'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
def signingValues = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }
def releaseDirectory = new File(System.getProperty('user.home'), '.config/talia/paravoid-release')
// Versions are major.minor.<commit count>: major and minor are set by hand in gradle.properties,
// the commit count of HEAD makes every build's version and versionCode increase monotonically.
def git = { String... args -> providers.exec { commandLine(['git'] + args.toList()) }.standardOutput.asText.get().trim() }
if (git('rev-parse', '--is-shallow-repository') == 'true') throw new GradleException('Versioning needs full git history; fetch with --unshallow')
def commitCount = git('rev-list', '--count', 'HEAD').toInteger()
def appVersion = "${providers.gradleProperty('taliaVersionMajor').get()}.${providers.gradleProperty('taliaVersionMinor').get()}.${commitCount}"
def newShell = providers.gradleProperty('paravoidNewShell').map { it.toBoolean() }.getOrElse(false)
def baselinePath = providers.gradleProperty('paravoidBaselineDirectory').getOrElse('../paravoid-baselines/apk-6')
// The shell contract pins the manifest versionName, so payload builds keep the accepted shell's
// value; a new shell generation takes the current app version.
def acceptedVersionName = {
    def contract = new groovy.json.JsonSlurper().parse(file("$baselinePath/paravoidAndroidRelease/shell-contract.json"))
    def key = '/@{http://schemas.android.com/apk/res/android}versionName'
    def find
    find = { node -> node instanceof Map ? (node.containsKey(key) ? node[key] : node.values().findResult { find(it) }) : node instanceof List ? node.findResult { find(it) } : null }
    find(contract) ?: { throw new GradleException("No accepted versionName in $baselinePath") }()
}
def shellVersionName = newShell ? appVersion : acceptedVersionName()
android {
    namespace 'com.lelloman.talia'
    compileSdk 36
    buildToolsVersion '36.1.0'
    defaultConfig {
        applicationId 'com.lelloman.talia'
        minSdk 30
        targetSdk 36
        versionCode commitCount
        versionName appVersion
        buildConfigField 'String', 'APP_VERSION', '"' + appVersion + '"'
        def storePins = System.getenv('LELLOSTORE_SIGNING_CERTIFICATES') ?: ''
        if (storePins && !(storePins ==~ /[0-9a-f]{64}(,[0-9a-f]{64})*/)) throw new GradleException('Invalid Store certificate pins')
        buildConfigField 'String', 'STORE_CERTIFICATES', '"' + storePins + '"'
        buildConfigField 'String', 'STORE_PACKAGE', '"com.lelloman.store"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    productFlavors {
        normal { applicationIdSuffix '.normal' }
        paravoidAndroid { applicationIdSuffix ''; versionName shellVersionName }
    }
    signingConfigs {
        release {
            if (signingValues.getProperty('storeFile')) {
                storeFile file(signingValues.getProperty('storeFile'))
                storePassword signingValues.getProperty('storePassword')
                keyAlias signingValues.getProperty('keyAlias')
                keyPassword signingValues.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true }
}
paravoid {
    packaging = 'complete'
    bootstrap = 'embedded'
    controlsLauncher = false
    minifyPayload = true
    payloadProguardFiles.from(file('payload-rules.pro'))
    crashRecovery { enabled = true; updater = 'default' }
    payloadVersion = providers.gradleProperty('paravoidPayloadVersion').map { it.toLong() }.getOrElse(commitCount.toLong())
    // APK 6 carries Paravoid 32461c8336's update engine; installed runtime changes need a new shell.
    if (!newShell) {
        baselineDirectory = layout.projectDirectory.dir(baselinePath)
    }
    signing {
        keyId = System.getenv('PARAVOID_SIGNING_KEY_ID') ?: 'talia-release'
        privateKeyFile = file(System.getenv('PARAVOID_SIGNING_KEY') ?: new File(releaseDirectory, 'talia-release.pk8').path)
    }
    updates {
        enabled = true
        baseUrl = System.getenv('PARAVOID_UPDATE_BASE_URL') ?: 'https://store.lelloman.com/api/paravoid/'
        authentication = 'apkKey'
        trustPolicyFile = file(System.getenv('PARAVOID_TRUST_POLICY') ?: new File(releaseDirectory, 'trust.json').path)
        // Stage updates in the background; ask before restarting into them.
        restartBehavior = 'prompt'
        schedule { checks = true; downloads = true }
        // The LelloStore app shares its server connection and wakes installed shells when
        // releases change. Trust is pinned to Store's release signing certificate.
        localTriggers {
            trustedCallers = ['com.lelloman.store': ['5d35a11c5b882924343a01dfc1836e7a78573a93e50af161d5769128994f9350']]
        }
    }
}
dependencies {
    implementation 'com.lelloman.store:notification-client:0.1.0'
    implementation 'it.lelloman.homelab:access-gateway-client:1.0.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    implementation "com.github.lelloman.paravoid-android:paravoid-runtime:${paravoidVersion}"
    implementation 'com.lelloman:lellodesign-compose:0.3.0-local'
    implementation project(':dashboard-compose')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.compose.material:material-icons-core'
}
