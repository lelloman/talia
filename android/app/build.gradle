plugins {
    id 'com.lelloman.paravoid'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
def signingValues = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }
def releaseDirectory = new File(System.getProperty('user.home'), '.config/talia/paravoid-release')
android {
    namespace 'com.lelloman.talia'
    compileSdk 36
    buildToolsVersion '36.1.0'
    defaultConfig {
        applicationId 'com.lelloman.talia'
        minSdk 30
        targetSdk 36
        versionCode 3
        versionName '0.1.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    productFlavors {
        normal { applicationIdSuffix '.normal' }
        paravoidAndroid { applicationIdSuffix '' }
    }
    signingConfigs {
        release {
            if (signingValues.getProperty('storeFile')) {
                storeFile file(signingValues.getProperty('storeFile'))
                storePassword signingValues.getProperty('storePassword')
                keyAlias signingValues.getProperty('keyAlias')
                keyPassword signingValues.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true }
}
paravoid {
    packaging = 'complete'
    bootstrap = 'embedded'
    controlsLauncher = false
    minifyPayload = true
    payloadProguardFiles.from(file('payload-rules.pro'))
    crashRecovery { enabled = true; updater = 'default' }
    payloadVersion = providers.gradleProperty('paravoidPayloadVersion').map { it.toLong() }.getOrElse(10L)
    // APK 3 introduces the gateway callback and network permission.
    baselineDirectory = layout.projectDirectory.dir(
        providers.gradleProperty('paravoidBaselineDirectory').getOrElse('../paravoid-baselines/apk-3'))
    signing {
        keyId = System.getenv('PARAVOID_SIGNING_KEY_ID') ?: 'talia-release'
        privateKeyFile = file(System.getenv('PARAVOID_SIGNING_KEY') ?: new File(releaseDirectory, 'talia-release.pk8').path)
    }
    updates {
        enabled = true
        baseUrl = System.getenv('PARAVOID_UPDATE_BASE_URL') ?: 'https://store.lelloman.com/api/paravoid/'
        authentication = 'apkKey'
        trustPolicyFile = file(System.getenv('PARAVOID_TRUST_POLICY') ?: new File(releaseDirectory, 'trust.json').path)
        schedule { checks = false; downloads = false }
    }
}
// Paravoid's payload R8 path does not collect dependency consumer rules itself.
def consumerRulesFile = layout.buildDirectory.file('generated/paravoid/consumer-rules.pro')
def collectPayloadConsumerRules = tasks.register('collectPayloadConsumerRules') {
    def runtime = configurations.named('paravoidAndroidReleaseRuntimeClasspath').map {
        it.incoming.artifactView {
            componentFilter { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
        }.files
    }
    inputs.files(runtime)
    outputs.file(consumerRulesFile)
    doLast {
        def rules = new StringBuilder()
        def collectZipRules = { InputStream stream, String origin, boolean aar ->
            new java.util.zip.ZipInputStream(stream).withCloseable { zip ->
                for (def entry = zip.nextEntry; entry != null; entry = zip.nextEntry) {
                    if ((!aar && entry.name.startsWith('META-INF/proguard/')) ||
                            (aar && entry.name == 'proguard.txt')) {
                        rules.append("\n# ${origin}: ${entry.name}\n")
                        rules.append(new String(zip.readAllBytes(), 'UTF-8')).append('\n')
                    }
                }
            }
        }
        runtime.get().files.sort { it.name }.each { artifact ->
            if (artifact.name.endsWith('.aar')) {
                collectZipRules(new FileInputStream(artifact), artifact.name, true)
                new java.util.zip.ZipFile(artifact).withCloseable { zip ->
                    zip.entries().findAll { it.name.endsWith('.jar') }.each { entry ->
                        collectZipRules(zip.getInputStream(entry), "${artifact.name}/${entry.name}", false)
                    }
                }
            } else if (artifact.name.endsWith('.jar')) {
                collectZipRules(new FileInputStream(artifact), artifact.name, false)
            }
        }
        def output = consumerRulesFile.get().asFile
        output.parentFile.mkdirs()
        output.text = rules.toString()
    }
}
paravoid.payloadProguardFiles.from(consumerRulesFile)
tasks.matching { it.name.startsWith('packageParavoidAndroid') && it.name.endsWith('ParavoidApplication') }.configureEach {
    dependsOn(collectPayloadConsumerRules)
}
dependencies {
    implementation 'it.lelloman.homelab:access-gateway-client:1.0.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    implementation project(':paravoid-runtime')
    implementation 'com.lelloman:lellodesign-compose:0.3.0-local'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.compose.material:material-icons-core'
}
