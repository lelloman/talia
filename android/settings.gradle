pluginManagement {
    // Paravoid is pinned to a GitHub commit built by JitPack (see gradle.properties).
    def paravoidVersion = providers.gradleProperty('paravoidVersion').get()
    repositories {
        maven {
            url = uri('https://jitpack.io')
            content { includeGroup('com.github.lelloman.paravoid-android') }
        }
        google(); mavenCentral(); gradlePluginPortal()
    }
    resolutionStrategy.eachPlugin {
        if (requested.id.id == 'com.lelloman.paravoid') {
            useModule("com.github.lelloman.paravoid-android:paravoid-gradle-plugin:${paravoidVersion}")
        }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google(); mavenCentral()
        maven {
            url = uri('https://jitpack.io')
            content { includeGroup('com.github.lelloman.paravoid-android') }
        }
        maven { url = uri(System.getenv("LELLOSTORE_NOTIFICATION_REPOSITORY") ?: "../../lellostore/android/build/notification-repository") }
    }
}
rootProject.name = 'Talia'
include ':app'
includeBuild(System.getenv('LELLODESIGN_COMPOSE_DIRECTORY') ?: '../../lellodesign/packages/compose') {
    dependencySubstitution {
        substitute module('com.lelloman:lellodesign-compose') using project(':lellodesign')
    }
}

includeBuild(System.getenv('HOMELAB_ACCESS_CLIENT_DIRECTORY') ?: '../../homelab/access-gateway/client-kotlin')
