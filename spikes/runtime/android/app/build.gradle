plugins { id 'com.android.application' }
android {
    namespace 'com.lelloman.talia.spike'
    compileSdk 36
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    defaultConfig {
        applicationId 'com.lelloman.talia.spike'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1'
        ndk { abiFilters(project.findProperty('taliaAbi') ?: 'x86_64') }
    }
    sourceSets.main.jniLibs.srcDirs = ['../../jniLibs']
}
