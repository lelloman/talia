<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talìa</title><link rel="icon" href="/assets/brand/favicon.svg"><link rel="stylesheet" href="/dashboard/web/dist/chrome.css"><link rel="stylesheet" href="/dashboard/web/style.css">
<div id="app"></div><noscript>JavaScript is required to run Talìa dashboards.</noscript>
<template id="host-content">
<p id="connection" class="lv-sr-only" role="status" aria-live="polite"></p><p id="shell-status" role="status" aria-live="polite"></p>
<section id="monitoring-surface" data-shell-page="dashboard" tabindex="-1">
<div id="monitoring-controls" role="toolbar" aria-label="Monitoring controls"><strong id="monitoring-current"></strong><button id="monitoring-previous">Previous dashboard</button><button id="monitoring-play" aria-pressed="false">Play rotation</button><button id="monitoring-next">Next dashboard</button><button id="monitoring-exit">Exit fullscreen</button></div>
<p id="monitoring-connection" role="status" aria-live="polite"></p><p id="monitoring-status" role="status" aria-live="polite"></p>
<div class="workspace-bar"><h2 id="dashboard-title" class="lv-sr-only">Dashboard</h2><div class="dashboard-switcher"><label for="dashboard-picker" class="lv-sr-only">Dashboard</label><select id="dashboard-picker" aria-label="Dashboard"></select><button id="open-dashboard" class="lv-sr-only">Open</button></div><div class="workspace-actions"><button id="make-default" class="lv-button lv-button--ghost">Use as my default</button><button id="reload" class="lv-button lv-button--ghost" aria-label="Reload"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span>Reload</span></button><button id="monitoring-enter" class="lv-button lv-button--neutral" aria-label="Fullscreen" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Fullscreen</span></button></div></div>
<p id="update" class="notice" role="status" hidden>Update available · reload to apply</p><p id="dirty" class="notice" role="status" hidden>Temporary ViewModel changes · reload to discard</p>
<section id="empty-dashboard" class="empty-state" hidden><h2>No dashboards available yet</h2><p>An admin can create a dashboard with MCP and share it with you. It will appear here when available.</p><button id="refresh-dashboards">Refresh dashboards</button></section>
<p id="diagnostic" role="alert" hidden></p><button id="restart" hidden>Restart dashboard</button>
<div id="dashboard" class="dashboard-canvas" role="region" aria-label="Monitoring dashboard"></div>
</section>
<section data-shell-page="settings" tabindex="-1" hidden><div data-lello-section id="client-settings"><summary>Client settings</summary><label>Client name <input id="client-name" maxlength="128"><button id="rename-client">Save name</button></label><label>CSS pixels per dp <input id="dp-scale" type="number" min="0.25" max="8" step="0.25"></label><label><input id="sidebar" type="checkbox">Dashboard side navigation</label></div>
<div data-lello-section id="monitoring-settings"><summary>Monitoring display</summary><p>Choose dashboards in display order, then open Fullscreen from the Dashboard page. Each switch loads a fresh dashboard instance.</p><label>Dashboard <select id="playlist-add-dashboard"></select><button id="playlist-add">Add to playlist</button></label><ol id="playlist-entries"></ol><label><input id="playlist-auto" type="checkbox">Start rotating when entering fullscreen</label><p id="playlist-status" role="status" aria-live="polite"></p></div>
<div data-lello-section id="ai-account-settings" hidden><summary>simple-ai</summary>
<p>Connect the dedicated Talìa account through LelloAuth. Talìa securely saves its renewable session on the server.</p>
<label>simple-ai server <input id="ai-account-origin" type="url" maxlength="2048" placeholder="https://simple-ai.example.com"></label>
<label>Model or class <input id="ai-account-model" maxlength="256"></label>
<button id="ai-account-connect">Connect LelloAuth account</button><button id="ai-account-refresh">Refresh account status</button>
<div id="ai-account-pending" hidden><p>Open <a id="ai-account-link" target="_blank" rel="noopener noreferrer">LelloAuth authorization</a> to sign in with the account to link. Connection code: <strong id="ai-account-code"></strong>.</p><p>Your current LelloAuth and Talìa sign-ins stay unchanged. Return here to confirm the linked account.</p></div>
<p id="ai-account-identity"></p><button id="ai-account-confirm" hidden>Use this account</button><button id="ai-account-disconnect">Disconnect account</button>
<p id="ai-account-status" role="status" aria-live="polite"></p></div>
<div data-lello-section id="telegram-settings" hidden><summary>Telegram</summary>
<p>Deliver reports and alerts, and ask read-only monitoring questions. Telegram cannot edit Talìa.</p>
<label>Bot token <input id="telegram-token" type="password" autocomplete="new-password" maxlength="256"></label><button id="telegram-connect">Connect / rotate bot token</button>
<p>Create a dedicated bot with BotFather. Keep it free of webhooks and other polling clients.</p>
<label><input id="telegram-enabled" type="checkbox">Enable Telegram</label>
<p id="telegram-ai-status" role="status"></p>
<label><input id="telegram-investigations" type="checkbox">Enable read-only investigations</label>
<label>Approved diagnostic source IDs (comma-separated) <input id="telegram-sources" maxlength="2048"></label>
<button id="telegram-save">Save Telegram settings</button><button id="telegram-refresh">Refresh status</button><p id="telegram-status" role="status" aria-live="polite"></p>
<h2>Pair a destination or account</h2><p>Codes expire after ten minutes. Send /pair CODE in a private chat, group, or channel with the bot present, then approve the detected numeric IDs here. Channels support delivery only. Group investigation answers are visible to all group members.</p>
<button id="telegram-pair">Create pairing code</button><div id="telegram-pairs"></div>
<h2>Destinations</h2><div id="telegram-peers"></div><h2>Allowed investigation accounts</h2><div id="telegram-users"></div>
<p id="telegram-deliveries"></p><div id="telegram-jobs"></div></div>
<div data-lello-section id="browser-push"><summary>Browser notifications</summary><p>Receive alert notifications even when this dashboard is in the background. Your browser must allow notifications and background delivery.</p><button id="browser-push-enable" disabled>Enable browser notifications</button><button id="browser-push-disable" disabled>Disable browser notifications</button><p id="browser-push-status" role="status" aria-live="polite"></p><p id="browser-push-destination"></p></div>
<div data-lello-section id="agent-access"><summary>Agent access</summary><p>Create a temporary key for your agent harness. Keys last one hour and use your current account permissions. Signing out of this login also invalidates its keys.</p>
<label>MCP URL <input id="agent-endpoint" readonly><button id="agent-endpoint-copy">Copy URL</button></label>
<p>Use Streamable HTTP with the key as a Bearer token. Viewer accounts cannot use authoring or engine tools.</p>
<button id="agent-key-create">Create agent key</button>
<div id="agent-key-created" hidden><label>One-time key <input id="agent-key-value" type="password" readonly autocomplete="off"></label><div class="lv-row"><button id="agent-key-copy">Copy key</button><button id="agent-config-copy">Copy MCP configuration</button><button id="agent-key-dismiss">Hide key</button></div></div>
<p id="agent-key-status" role="status" aria-live="polite"></p><div id="agent-key-list"></div></div></section>
<section data-shell-page="chats" tabindex="-1" hidden><div id="chats"></div></section>
<section data-shell-page="reports" tabindex="-1" hidden><div id="report-schedules"></div></section>
<section data-shell-page="sharing" tabindex="-1" hidden><div data-lello-section id="sharing" hidden><summary>Dashboard sharing</summary><p>Sharing includes every read resource exposed by this dashboard.</p><label><input type="checkbox" id="share-public">Available to all signed-in users</label><label>Share with users <select id="share-users" multiple aria-label="Users allowed to view this dashboard"></select></label><div class="lv-row"><button id="save-sharing">Save sharing</button><button id="discard-sharing">Discard changes</button></div><p id="sharing-draft" class="lv-muted" hidden>Unsaved sharing changes</p></div></section>
<section data-shell-page="users" tabindex="-1" hidden><div data-lello-section id="user-admin" hidden><summary>User access</summary><p>Viewers can view shared dashboards. Admins can configure all dashboards and engine data.</p><div id="user-list"></div></div></section>
<section data-shell-page="alerts" tabindex="-1" hidden><div data-lello-section id="alerts-panel"><summary>Alerts</summary><label>Alert access token <input id="alert-access" type="password" autocomplete="off"></label><button id="alert-connect">Connect alerts</button><button id="alert-refresh">Refresh alerts</button><p id="alert-status" role="status" aria-live="polite"></p><div id="alert-list"></div></div></section>
</template><script type="module" src="/dashboard/web/auth.js"></script></html>
