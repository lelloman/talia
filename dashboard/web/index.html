<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talìa</title><link rel="icon" href="/assets/brand/favicon.svg"><link rel="stylesheet" href="/dashboard/web/dist/chrome.css"><link rel="stylesheet" href="/dashboard/web/style.css">
<div id="app"></div><noscript>JavaScript is required to run Talìa dashboards.</noscript>
<template id="host-content">
<p id="connection" class="lv-sr-only" role="status" aria-live="polite"></p><p id="shell-status" role="status" aria-live="polite"></p>
<section data-shell-page="dashboard">
<div class="workspace-bar"><div><p class="eyebrow">WORKSPACE</p><h1 id="dashboard-title" tabindex="-1">Dashboard</h1></div><div class="workspace-actions"><label for="dashboard-picker">Dashboard</label><select id="dashboard-picker" aria-label="Dashboard"></select><button id="open-dashboard">Open</button><button id="make-default">Use as my default</button><button id="reload">Reload</button></div></div>
<p id="update" class="notice" role="status" hidden>Update available · reload to apply</p><p id="dirty" class="notice" role="status" hidden>Temporary ViewModel changes · reload to discard</p>
<section id="empty-dashboard" class="empty-state" hidden><h2>No dashboards available yet</h2><p>An admin can create a dashboard with MCP and share it with you. It will appear here when available.</p><button id="refresh-dashboards">Refresh dashboards</button></section>
<p id="diagnostic" role="alert" hidden></p><button id="restart" hidden>Restart dashboard</button>
<div id="dashboard" class="dashboard-canvas" role="region" aria-label="Monitoring dashboard"></div>
</section>
<section data-shell-page="settings" hidden><h1 tabindex="-1">Settings</h1><p class="page-description">Configure this browser’s dashboard presentation.</p><details id="client-settings" open><summary>Client settings</summary><label>Client name <input id="client-name" maxlength="128"><button id="rename-client">Save name</button></label><label>CSS pixels per dp <input id="dp-scale" type="number" min="0.25" max="8" step="0.25"></label><label><input id="sidebar" type="checkbox">Dashboard side navigation</label></details>
<details id="browser-push" open><summary>Browser notifications</summary><p>Receive alert notifications even when this dashboard is in the background. Your browser must allow notifications and background delivery.</p><button id="browser-push-enable" disabled>Enable browser notifications</button><button id="browser-push-disable" disabled>Disable browser notifications</button><p id="browser-push-status" role="status" aria-live="polite"></p><p id="browser-push-destination"></p></details>
<details id="agent-access" open><summary>Agent access</summary><p>Create a temporary key for your agent harness. Keys last one hour and use your current account permissions. Signing out of this login also invalidates its keys.</p>
<label>MCP URL <input id="agent-endpoint" readonly><button id="agent-endpoint-copy">Copy URL</button></label>
<p>Use Streamable HTTP with the key as a Bearer token. Viewer accounts cannot use authoring or engine tools.</p>
<button id="agent-key-create">Create agent key</button>
<div id="agent-key-created" hidden><label>One-time key <input id="agent-key-value" type="password" readonly autocomplete="off"></label><div class="lv-row"><button id="agent-key-copy">Copy key</button><button id="agent-config-copy">Copy MCP configuration</button><button id="agent-key-dismiss">Hide key</button></div></div>
<p id="agent-key-status" role="status" aria-live="polite"></p><div id="agent-key-list"></div></details></section>
<section data-shell-page="sharing" hidden><h1 tabindex="-1">Sharing</h1><p class="page-description">Manage access to the dashboard currently open in your workspace.</p><details id="sharing" hidden open><summary>Dashboard sharing</summary><p>Sharing includes every read resource exposed by this dashboard.</p><label><input type="checkbox" id="share-public">Available to all signed-in users</label><label>Share with users <select id="share-users" multiple aria-label="Users allowed to view this dashboard"></select></label><div class="lv-row"><button id="save-sharing">Save sharing</button><button id="discard-sharing">Discard changes</button></div><p id="sharing-draft" class="lv-muted" hidden>Unsaved sharing changes</p></details></section>
<section data-shell-page="users" hidden><h1 tabindex="-1">Users</h1><p class="page-description">Control who can administer Talìa.</p><details id="user-admin" hidden open><summary>User access</summary><p>Viewers can view shared dashboards. Admins can configure all dashboards and engine data.</p><div id="user-list"></div></details></section>
<section data-shell-page="alerts" hidden><h1 tabindex="-1">Alerts</h1><p class="page-description">Current conditions and recent alert activity.</p><details id="alerts-panel" open><summary>Alerts</summary><label>Alert access token <input id="alert-access" type="password" autocomplete="off"></label><button id="alert-connect">Connect alerts</button><button id="alert-refresh">Refresh alerts</button><p id="alert-status" role="status" aria-live="polite"></p><div id="alert-list"></div></details></section>
</template><script type="module" src="/dashboard/web/auth.js"></script></html>
