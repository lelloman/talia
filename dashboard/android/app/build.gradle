plugins { id 'com.android.application' }
android {
 namespace 'com.lelloman.talia.dashboard'
 compileSdk 36
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 defaultConfig { applicationId 'com.lelloman.talia.dashboard'; minSdk 26; targetSdk 36; versionCode 1; versionName '0.1'; ndk { abiFilters(project.findProperty('taliaAbi') ?: 'x86_64') } }
 sourceSets.main.jniLibs.srcDirs = ['../../jniLibs']
 sourceSets.main.assets.srcDirs = ['../../shared', '../../examples', '../../generated', '../../../engine/shared']
 defaultConfig {
  buildConfigField 'String', 'FIREBASE_APP_ID', '"' + (project.findProperty('firebaseAppId') ?: '') + '"'
  buildConfigField 'String', 'FIREBASE_API_KEY', '"' + (project.findProperty('firebaseApiKey') ?: '') + '"'
  buildConfigField 'String', 'FIREBASE_PROJECT_ID', '"' + (project.findProperty('firebaseProjectId') ?: '') + '"'
  buildConfigField 'String', 'FIREBASE_SENDER_ID', '"' + (project.findProperty('firebaseSenderId') ?: '') + '"'
 }
 buildFeatures { buildConfig true }
}

dependencies { implementation "com.google.firebase:firebase-messaging:25.1.3" }
