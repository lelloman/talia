[package]
name = "talia-engine"
version = "0.1.0"
edition = "2021"
default-run = "talia-engine"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rquickjs = { version = "=0.13.0", features = ["bindgen"] }
rusqlite = { version = "=0.32.1", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "sync", "time", "test-util", "fs", "io-util"] }
futures-util = "0.3"
axum = "=0.8.9"
chrono = "=0.4.45"
chrono-tz = "=0.10.4"
url = "=2.5.8"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }

ring = "=0.17.14"

rmcp = { version = "=3.1.4", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }

lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
base64 = "=0.22.1"

jsonwebtoken = { version = "=9.3.1", default-features = false, features = ["use_pem"] }
thiserror = "=2.0.20"

[dev-dependencies]
wiremock = "=0.6.5"
tower = { version = "=0.5.3", features = ["util"] }
