[workspace]
resolver = "2"
members = ["crates/simple-agents-client", "crates/simple-agents-protocol"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["lelloman"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
simple-server = { path = "../simple-server", features = ["logging", "health"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
