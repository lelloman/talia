<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talìa — Sign in</title>
<style>body{font:18px system-ui;max-width:32rem;margin:15vh auto;padding:1rem}input,button{font:inherit;padding:.6rem;box-sizing:border-box;width:100%;margin:.5rem 0}</style>
<h1>Talìa</h1><form><label>Deployment access key <input type="password" required autocomplete="current-password"></label><button>Sign in</button></form><p role="alert"></p>
<script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const input=document.querySelector('input'),message=document.querySelector('p');try{const r=await fetch('/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:input.value})});input.value='';if(!r.ok)throw Error('Sign-in failed');location.replace('/');}catch(e){message.textContent=e.message;}};</script></html>
